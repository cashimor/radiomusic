plugins {
    id 'com.android.application'
}

android {
    namespace 'com.cashimor.radiomusic'
    compileSdk 36
    ndkVersion '30.0.16248370'
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    defaultConfig {
        applicationId 'com.cashimor.radiomusic'
        minSdk 26
        targetSdk 28
        versionCode 1
        versionName '0.1.0'
        ndk {
            abiFilters 'arm64-v8a'
        }
        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17 -O2'
                arguments '-DANDROID_STL=c++_shared'
                targets 'RadioNative'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path '../../CMakeLists.txt'
            version '3.22.1'
        }
    }
}
